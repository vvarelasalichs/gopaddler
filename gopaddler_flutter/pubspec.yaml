name: gopaddler_flutter
description: "GoPaddler - Flutter Migration. Track speed, distance and stroke rate using GoPaddler with Bluetooth sensors and GPS tracking."

publish_to: 'none'

version: 1.8.0+1800

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.0
  provider: ^6.0.0
  get_it: ^7.6.0

  # Geolocation & Sensors
  geolocator: ^9.0.0
  flutter_blue_plus: ^1.31.0
  sensors_plus: ^2.0.0
  workmanager: ^0.5.1

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  
  # Networking & Sync
  web_socket_channel: ^2.4.0
  http: ^1.1.0
  
  # UI & Navigation
  go_router: ^12.0.0
  cupertino_icons: ^1.0.0
  
  # Gráficos
  fl_chart: ^0.68.0
  
  # Utilidades
  intl: ^0.20.2
  # just_audio: ^0.9.31  # TODO: Fix web compatibility
  vibration: ^1.8.0
  connectivity_plus: ^5.0.0
  device_info_plus: ^9.0.0
  package_info_plus: ^5.0.0
  
  # Locale
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  bloc_test: ^9.1.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/sounds/
    - assets/config/

  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700
